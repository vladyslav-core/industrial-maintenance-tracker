<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users | Industrial Maintenance Tracker</title>
</head>
<body>
<main>
    <h1>User management</h1>

    <p>
        <a th:href="@{/}">Back to home</a>
    </p>

    <p th:if="${#lists.isEmpty(users)}">
        No users found.
    </p>

    <table th:if="${not #lists.isEmpty(users)}">
        <thead>
        <tr>
            <th>Full name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Created</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.fullName}">System Administrator</td>
            <td th:text="${user.email}">admin@example.com</td>
            <td th:text="${user.role}">ADMIN</td>
            <td th:text="${user.active ? 'Active' : 'Inactive'}">
                Active
            </td>
            <td th:text="${user.createdAt}">
                2026-09-17T09:00:00Z
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
