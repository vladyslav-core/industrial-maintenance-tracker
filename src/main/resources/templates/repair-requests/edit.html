<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit request | Industrial Maintenance Tracker</title>
</head>
<body>
<main>
    <h1 th:text="${'Edit request #' + requestId}">Edit request</h1>
    <p>
        <a th:href="@{/repair-requests/{id}(id=${requestId})}">Back to request</a> |
        <a th:href="@{/repair-requests/{id}/edit(id=${requestId})}">Reload current details</a>
    </p>
    <p th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <form method="post" th:action="@{/repair-requests/{id}/edit(id=${requestId})}"
          th:object="${editForm}">
        <input type="hidden" th:field="*{updatedAt}">
        <p th:if="${#fields.hasErrors('updatedAt')}">Reload the request to get its current version.</p>
        <p>
            <label for="title">Problem title</label>
            <input id="title" type="text" th:field="*{title}" required minlength="5" maxlength="150">
            <span th:errors="*{title}"></span>
        </p>
        <p>
            <label for="description">Problem description</label>
            <textarea id="description" th:field="*{description}" required minlength="10"
                      maxlength="3000" rows="8"></textarea>
            <span th:errors="*{description}"></span>
        </p>
        <button th:if="${canSave}" type="submit">Save changes</button>
    </form>
</main>
</body>
</html>
