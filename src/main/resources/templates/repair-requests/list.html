<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Repair requests | Industrial Maintenance Tracker</title>
</head>
<body>
<main>
    <h1>Repair requests</h1>
    <p>
        <a th:href="@{/}">Home</a> |
        <a th:href="@{/equipment}">Equipment</a> |
        <a th:href="@{/repair-requests/new}">New request</a>
    </p>
    <p th:if="${successMessage}" th:text="${successMessage}"></p>
    <form method="get" th:action="@{/repair-requests}" th:object="${filters}">
        <p>
            <label for="search">Number or problem text</label>
            <input id="search" type="search" th:field="*{search}">
        </p>
        <p>
            <label for="status">Status</label>
            <select id="status" th:field="*{status}">
                <option value="">All statuses</option>
                <option th:each="value : ${statuses}" th:value="${value}" th:text="${value}"></option>
            </select>
            <label for="priority">Priority</label>
            <select id="priority" th:field="*{priority}">
                <option value="">All priorities</option>
                <option th:each="value : ${priorities}" th:value="${value}" th:text="${value}"></option>
            </select>
        </p>
        <p>
            <label for="equipmentId">Equipment</label>
            <select id="equipmentId" th:field="*{equipmentId}">
                <option value="">All equipment</option>
                <option th:each="option : ${page.equipment}" th:value="${option.id}"
                        th:text="${option.label}"></option>
            </select>
            <label for="technicianId">Technician</label>
            <select id="technicianId" th:field="*{technicianId}">
                <option value="">All technicians</option>
                <option th:each="option : ${page.technicians}" th:value="${option.id}"
                        th:text="${option.label}"></option>
            </select>
        </p>
        <p th:if="${page.administrator}">
            <label for="authorId">Author</label>
            <select id="authorId" th:field="*{authorId}">
                <option value="">All authors</option>
                <option th:each="option : ${page.authors}" th:value="${option.id}"
                        th:text="${option.label}"></option>
            </select>
        </p>
        <p th:if="${page.technician}">
            <label for="scope">Requests</label>
            <select id="scope" th:field="*{scope}">
                <option value="ALL">All visible</option>
                <option value="CREATED_BY_ME">Created by me</option>
                <option value="ASSIGNED_TO_ME">Assigned to me</option>
            </select>
        </p>
        <button type="submit">Apply</button>
        <a th:href="@{/repair-requests}">Clear</a>
    </form>
    <p th:if="${#lists.isEmpty(requests)}">No requests match the selected filters.</p>
    <table th:if="${not #lists.isEmpty(requests)}">
        <thead>
        <tr>
            <th>Number</th><th>Problem</th><th>Equipment</th><th>Author</th>
            <th>Technician</th><th>Priority</th><th>Status</th>
            <th>Created</th><th>Last updated</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${requests}">
            <td><a th:href="@{/repair-requests/{id}(id=${item.id})}"
                   th:text="${'#' + item.id}">#123</a></td>
            <td th:text="${item.title}">Oil leak</td>
            <td><a th:href="@{/equipment/{id}(id=${item.equipmentId})}"
                   th:text="${item.equipmentName}">Hydraulic press</a></td>
            <td th:text="${item.authorName}">Author</td>
            <td th:text="${item.technicianName != null ? item.technicianName : 'Not assigned'}"></td>
            <td th:text="${item.priority}">MEDIUM</td>
            <td th:text="${item.status}">NEW</td>
            <td th:text="${item.createdAt}"></td>
            <td th:text="${item.updatedAt}"></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
